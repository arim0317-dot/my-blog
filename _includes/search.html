<style>
.progress-items {
  display: flex;
  gap: 2rem;
  margin: 2rem 0;
  flex-wrap: wrap;
}

.progress-item {
  background: linear-gradient(135deg, rgba(201, 117, 106, 0.08) 0%, rgba(168, 168, 156, 0.05) 100%);
  padding: 1.5rem;
  border-radius: 8px;
  border-left: 4px solid var(--highlight);
  flex: 1;
  min-width: 200px;
}

.progress-item .label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.5rem;
}

.progress-item .value {
  display: block;
  font-size: 16px;
  font-weight: 600;
  color: var(--primary);
  font-family: 'Noto Serif KR', serif;
}

.home-intro {
  background: var(--bg-primary);
  border-radius: 12px;
  padding: 2.5rem;
  margin-bottom: 3rem;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-light);
}

.home-intro h2 {
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
  font-family: 'Noto Serif KR', serif;
  margin-bottom: 1rem;
}

.home-intro p {
  font-size: 16px;
  color: var(--text-secondary);
  margin-bottom: 1.5rem;
}

.search-results {
  margin-top: 2rem;
}

.search-results.hidden {
  display: none;
}

.search-result-item {
  background: var(--bg-primary);
  border-radius: 8px;
  padding: 1.5rem;
  margin-bottom: 1rem;
  border-left: 4px solid var(--highlight);
  transition: all 0.3s ease;
}

.search-result-item:hover {
  transform: translateX(4px);
  box-shadow: var(--shadow-md);
}

.search-result-item a {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  text-decoration: none;
  font-family: 'Noto Serif KR', serif;
  background: linear-gradient(135deg, var(--primary) 0%, var(--highlight) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.search-result-item .date {
  display: block;
  font-size: 13px;
  color: var(--text-light);
  margin-top: 0.5rem;
}

.no-results {
  text-align: center;
  padding: 2rem;
  color: var(--text-light);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');
  const postList = document.querySelector('.post-list');

  if (!searchInput || !postList) return;

  const posts = [];
  postList.querySelectorAll('li').forEach(item => {
    const titleElement = item.querySelector('.post-link');
    const dateElement = item.querySelector('.post-meta');
    if (titleElement) {
      posts.push({
        title: titleElement.textContent.trim(),
        url: titleElement.href,
        date: dateElement ? dateElement.textContent.trim() : '',
        element: item
      });
    }
  });

  searchInput.addEventListener('input', function() {
    const query = this.value.toLowerCase().trim();

    if (query.length === 0) {
      // 검색 결과 숨기기
      searchResults.classList.add('hidden');
      searchResults.innerHTML = '';
      postList.style.display = 'grid';
      return;
    }

    // 검색 필터링
    const filtered = posts.filter(post =>
      post.title.toLowerCase().includes(query) ||
      post.date.toLowerCase().includes(query)
    );

    if (filtered.length === 0) {
      searchResults.classList.remove('hidden');
      searchResults.innerHTML = '<div class="no-results">검색 결과가 없습니다.</div>';
      postList.style.display = 'none';
      return;
    }

    // 검색 결과 표시
    searchResults.classList.remove('hidden');
    searchResults.innerHTML = filtered.map(post => `
      <div class="search-result-item">
        <a href="${post.url}">${post.title}</a>
        <span class="date">${post.date}</span>
      </div>
    `).join('');

    postList.style.display = 'none';
  });
});
</script>
