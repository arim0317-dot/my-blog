# 사이트 기본 정보
title: "내 블로그 제목"
author: "작성자 이름"
description: "블로그에 대한 짧은 설명입니다."
url: "https://arim0317-dot.github.io"
baseurl: "/my-blog"

permalink: /:title/
lang: "ko"
excerpt_separator: "\n\n\n"
date_format: "%Y년 %m월 %d일"

# ── 레이아웃 옵션 ──
show_excerpts: true        # 홈에서 글 요약(발췌) 보여주기
show_frame: true           # 사이트 전체에 회색 프레임 추가
show_sidebar: false        # true로 하면 상단 헤더 대신 사이드바 사용

# ── 상단 메뉴 ──
navigation:                # {file, title, url, icon, sidebaricon} 형태로 작성
  - {file: "index.html"}
  - {file: "about.md"}

# ── 하단 소셜 링크 (아이콘은 fontawesome.com/icons 참고) ──
external:
  - {title: Mail, icon: envelope, url: "mailto:you@example.com"}
  - {title: Github, icon: github, url: "https://github.com/arim0317-dot"}
  - {title: Subscribe, icon: rss, url: "/feed.xml"}

# ── 댓글 (선택 사항, 원하는 것만 주석 해제) ──
comments:
  # disqus_shortname: "your-disqus-shortname"
  # isso_domain: "https://isso.yourdomain.com"

# ── 테마 & 플러그인 (GitHub Pages에서 remote_theme로 사용 시) ──
remote_theme: niklasbuschmann/contrast@v2.11

plugins:
  - jekyll-remote-theme
  - jekyll-feed