# ---------------------------
# 기본 사이트 정보
# ---------------------------
title: 내 블로그
description: 여기에 블로그 소개를 적어주세요
lang: ko

# GitHub Pages 프로젝트 사이트 설정 (arim0317-dot.github.io/my-blog/)
url: "https://arim0317-dot.github.io"
baseurl: "/my-blog"

# ---------------------------
# 테마 설정 (beautiful-jekyll)
# ---------------------------
remote_theme: daattali/beautiful-jekyll
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

# ---------------------------
# 프로필 / 네비게이션
# ---------------------------
avatar: ""            # 프로필 이미지 경로, 예: "/assets/img/avatar.png"
title-img: ""         # 첫 화면 배경 이미지 (없으면 빈 값)

navbar-links:
  Home: "/"
  About: "about"

# ---------------------------
# 소셜 링크 (안 쓰는 항목은 지워도 됨)
# ---------------------------
social-network-links:
  github: arim0317-dot
  email: your-email@example.com

# ---------------------------
# 기타
# ---------------------------
paginate: 5
markdown: kramdown