title: "아림의 학습 블로그"
description: "개발을 배우며 그날그날 정리한 것을 기록하는 아림의 학습 블로그입니다."
url: "https://arim0317.github.io"
baseurl: "/my-blog"  # 또는 "/my-blog" (배포 위치에 따라)

author:
  name: "신아림"
  email: "arim0317@g.eulji.ac.kr"

theme: jekyll-theme-minimal
markdown: kramdown
permalink: /:year/:month/:day/:title/

# 블로그 기능
show_excerpts: true
paginate: 10
paginate_path: "/page:num/"

# 플러그인
plugins:
  - jekyll-paginate
  - jekyll-seo-tag

# 제외할 파일
exclude:
  - .gitignore
  - README.md
  - CLAUDE.md
  - .claude