# 사이트 기본 정보
title: "나의 블로그"
author: "신아림"
description: "블로그에 대한 짧은 설명입니다."
url: "https://arim0317-dot.github.io"
baseurl: "/my-blog"

# ── 테마 ──
theme: minima

# ── Minima 세부 옵션 ──
minima:
  skin: classic             # classic, dark, solarized, solarized-dark 중 선택 가능
  date_format: "%Y년 %m월 %d일"

  social_links:
    - { platform: github,  user_url: "https://github.com/arim0317-dot" }
    # - { platform: twitter, user_url: "https://twitter.com/아이디" }
    # - { platform: email,   user_url: "mailto:you@example.com" }

# ── 플러그인 (Minima와 기본 호환) ──
plugins:
  - jekyll-feed
  - jekyll-seo-tag