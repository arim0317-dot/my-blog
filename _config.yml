############################
# --- Required options --- #
############################

title: "아림의 학습 블로그"
author: "신아림"

url: "https://arim0317-dot.github.io"
baseurl: "/my-blog"

# RSS feed 설명 (https://<url>/feed.xml)
rss-description: "개발을 배우며 정리하는 학습 블로그"

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  글쓰기: "/write/"

################
# --- Logo --- #
################

# 프로필 사진을 assets/img/avatar.jpg 로 추가한 뒤 아래 줄의 주석을 해제하면
# 홈 화면의 "전체 글" 사이드바에 있는 프로필 카드에 표시된다. (설정 전까지는 이니셜 원형이 대신 보인다)
# avatar: "/assets/img/avatar.jpg"

#####################################
# --- Footer social media links --- #
#####################################

# 소셜 링크를 추가하고 싶으면 아래 형식으로 주석을 해제한다.
# social-network-links:
#   email: "arim0317@g.eulji.ac.kr"
#   github: arim0317-dot

###########################
# --- General options --- #
###########################

# 게시글 피드에 보여줄 발췌문 길이 (단어 수)
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true

# 네비게이션 바에 검색 버튼 추가
post_search: true

# 검색창 등 모든 페이지에 공통으로 적용할 스타일
site-css:
  - "/assets/css/search.css"

# GitHub에 호스팅된 페이지에 "이 페이지 수정" 버튼 추가
edit_page_button: true

######################################
# --- Colours / background image --- #
######################################

page-col: "#FFFFFF"
text-col: "#2c2c2c"
link-col: "#c0392b"
hover-col: "#8e2a1f"
navbar-col: "#f9f5f0"
navbar-text-col: "#2c2c2c"
navbar-border-col: "#e8dfd3"
footer-col: "#3d3d52"
footer-text-col: "#dddddd"
footer-link-col: "#ffffff"
footer-hover-col: "#e89584"

##########################################
# --- Jekyll / Beautiful Jekyll setup --- #
##########################################

remote_theme: "daattali/beautiful-jekyll@6.0.1"

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge
permalink: /:year/:month/:day/:title/
paginate: 10

date_format: "%Y-%m-%d"

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"

exclude:
  - .gitignore
  - README.md
  - CLAUDE.md
  - .claude
