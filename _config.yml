############################
# --- Required options --- #
############################

title: "Arim's Blog"
tagline: "천천히, 그러나 꾸준히 — 개발을 배우며 그날그날 정리한 것을 남깁니다"
author: "신아림"

url: "https://arim0317-dot.github.io"
baseurl: "/my-blog"

# RSS feed 설명 (https://<url>/feed.xml)
rss-description: "개발을 배우며 정리하는 학습 블로그"

###############################################
# --- List of links in the navigation bar --- #
###############################################

navbar-links:
  지식 지도: "/graph/"

################
# --- Logo --- #
################

# 프로필 카드의 GitHub 링크
github_url: "https://github.com/arim0317-dot/my-blog"

# 홈의 "오늘의 날씨" 위치 (Open-Meteo, 위도/경도). 기본값은 서울.
weather:
  city: "서울"
  lat: 37.5665
  lon: 126.978

# 프로필 사진을 assets/img/avatar.jpg 로 추가한 뒤 아래 줄의 주석을 해제하면
# 홈 화면의 "전체 글" 사이드바에 있는 프로필 카드에 표시된다. (설정 전까지는 이니셜 원형이 대신 보인다)
# avatar: "/assets/img/avatar.jpg"

###########################################
# --- 방문자 카운터 (GoatCounter) --- #
###########################################

# goatcounter.com 에서 무료 가입 후 만든 사이트 코드를 입력한다. (https://<코드>.goatcounter.com)
# 비워 두면 추적 스크립트와 방문자 카운터가 모두 꺼진다.
# 사이트 설정에서 "Allow adding visitor counts on your website" 를 켜고,
# Timezone 을 Asia/Seoul 로 맞춰야 "오늘" 집계가 한국 시간 기준으로 나온다.
goatcounter: ""

#####################################
# --- Footer social media links --- #
#####################################

# 소셜 링크를 추가하고 싶으면 아래 형식으로 주석을 해제한다.
# social-network-links:
#   email: "arim0317@g.eulji.ac.kr"
#   github: arim0317-dot

###########################
# --- General options --- #
###########################

# 게시글 피드에 보여줄 발췌문 길이 (단어 수)
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true

# 네비게이션 바에 검색 버튼 추가
post_search: true

# 검색창 등 모든 페이지에 공통으로 적용할 스타일
site-css:
  - "/assets/css/theme.css"
  - "/assets/css/calendar.css"
  - "/assets/css/search.css"
  - "/assets/css/features.css"

# 모든 페이지에 적용되는 스크립트 (맨 위로 버튼, 코드 복사, 목차)
site-js:
  - "/assets/js/features.js"

# GitHub에 호스팅된 페이지에 "이 페이지 수정" 버튼 추가
edit_page_button: true

######################################
# --- Colours / background image --- #
######################################

page-col: "#f6f4ef"
text-col: "#2a2a28"
link-col: "#2f6b4f"
hover-col: "#1f4d38"
navbar-col: "#f6f4ef"
navbar-text-col: "#2a2a28"
navbar-border-col: "#e4dfd3"
footer-col: "#eeeae1"
footer-text-col: "#6f6b60"
footer-link-col: "#2f6b4f"
footer-hover-col: "#1f4d38"

##########################################
# --- Jekyll / Beautiful Jekyll setup --- #
##########################################

remote_theme: "daattali/beautiful-jekyll@6.0.1"

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge
permalink: /:year/:month/:day/:title/

date_format: "%Y-%m-%d"

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"
      head-extra:
        - fonts.html
        - goatcounter.html

exclude:
  - .gitignore
  - README.md
  - CLAUDE.md
  - .claude
